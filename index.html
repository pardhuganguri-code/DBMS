<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DBMS Question Sets</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f0f13;
      color: #e0e0e0;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-bottom: 1px solid rgba(99, 102, 241, 0.2);
      padding: 1.5rem 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #a5b4fc;
      letter-spacing: 0.5px;
    }

    header p {
      color: #6b7280;
      font-size: 0.85rem;
      margin-top: 0.3rem;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Set selector */
    .selector {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .selector label {
      font-size: 0.95rem;
      color: #9ca3af;
      font-weight: 500;
    }

    .selector select {
      background: #1e1e2e;
      color: #e0e0e0;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 0.55rem 1rem;
      font-size: 0.95rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .selector select:focus {
      border-color: #6366f1;
    }

    /* Quick pick grid */
    .quick-pick {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 1.5rem;
    }

    .quick-pick button {
      width: 42px;
      height: 36px;
      border: 1px solid #2a2a3a;
      background: #1a1a28;
      color: #9ca3af;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .quick-pick button:hover {
      background: #2a2a40;
      border-color: #6366f1;
      color: #e0e0e0;
    }

    .quick-pick button.active {
      background: #6366f1;
      border-color: #6366f1;
      color: #fff;
    }

    /* PDF viewer */
    .viewer {
      background: #1a1a28;
      border: 1px solid #2a2a3a;
      border-radius: 10px;
      overflow: hidden;
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewer iframe {
      width: 100%;
      height: 80vh;
      border: none;
    }

    .placeholder {
      text-align: center;
      color: #4b5563;
      padding: 3rem;
    }

    .placeholder svg {
      width: 48px;
      height: 48px;
      margin-bottom: 1rem;
      opacity: 0.4;
    }

    .placeholder p {
      font-size: 0.95rem;
    }

    .file-label {
      font-size: 0.8rem;
      color: #6b7280;
      margin-bottom: 0.5rem;
    }

    /* Download link */
    .actions {
      margin-top: 0.75rem;
      display: flex;
      gap: 0.75rem;
    }

    .actions a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: #818cf8;
      text-decoration: none;
      font-size: 0.85rem;
      padding: 0.4rem 0.8rem;
      background: rgba(99, 102, 241, 0.08);
      border-radius: 6px;
      transition: background 0.15s;
    }

    .actions a:hover {
      background: rgba(99, 102, 241, 0.18);
    }

    @media (max-width: 600px) {
      .container { padding: 1rem; }
      header h1 { font-size: 1.3rem; }
      .quick-pick button { width: 38px; height: 34px; font-size: 0.75rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>DBMS Question Sets</h1>
    <p>Select a set number to view the PDF</p>
  </header>

  <div class="container">
    <!-- Dropdown selector -->
    <div class="selector">
      <label for="set-select">Set:</label>
      <select id="set-select">
        <option value="">— Choose a set —</option>
      </select>
    </div>

    <!-- Quick pick buttons -->
    <div class="quick-pick" id="quick-pick"></div>

    <!-- File name label + download -->
    <div class="file-label" id="file-label"></div>
    <div class="actions" id="actions"></div>

    <!-- PDF embed -->
    <div class="viewer" id="viewer">
      <div class="placeholder">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/>
        </svg>
        <p>Select a set number above to view its PDF</p>
      </div>
    </div>
  </div>

  <script>
    const TOTAL_SETS = 25;
    const select = document.getElementById('set-select');
    const quickPick = document.getElementById('quick-pick');
    const viewer = document.getElementById('viewer');
    const fileLabel = document.getElementById('file-label');
    const actions = document.getElementById('actions');

    // Pad number to 2 digits
    function pad(n) { return String(n).padStart(2, '0'); }

    // Build filename from set number
    function fileName(n) { return `DBMS_Set_${pad(n)}.pdf`; }
    function filePath(n) { return `assets/${fileName(n)}`; }

    // Populate dropdown
    for (let i = 1; i <= TOTAL_SETS; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `Set ${pad(i)}`;
      select.appendChild(opt);
    }

    // Populate quick-pick buttons
    for (let i = 1; i <= TOTAL_SETS; i++) {
      const btn = document.createElement('button');
      btn.textContent = pad(i);
      btn.dataset.set = i;
      btn.addEventListener('click', () => loadSet(i));
      quickPick.appendChild(btn);
    }

    // Load a set
    function loadSet(n) {
      // Update dropdown
      select.value = n;

      // Update active button
      quickPick.querySelectorAll('button').forEach(b =>
        b.classList.toggle('active', Number(b.dataset.set) === n)
      );

      // Show file label
      const name = fileName(n);
      const path = filePath(n);
      fileLabel.textContent = name;

      // Show download link
      actions.innerHTML = `<a href="${path}" download="${name}">⬇ Download PDF</a>
                           <a href="${path}" target="_blank">↗ Open in new tab</a>`;

      // Embed PDF
      viewer.innerHTML = `<iframe src="${path}" title="${name}"></iframe>`;
    }

    // Dropdown change handler
    select.addEventListener('change', () => {
      const v = Number(select.value);
      if (v) loadSet(v);
    });
  </script>
</body>
</html>
